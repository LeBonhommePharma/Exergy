# Dedicated iPad canvas (same Core as iPhone; split view, not a phone scale-up).
#
#     cd Exergy/Apps/iPad && rm -rf ExergyPad.xcodeproj && xcodegen generate

name: ExergyPad
options:
  bundleIdPrefix: com.lebonhommepharma.exergy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  ExergyCore:
    path: ../../Packages/ExergyCore
  ExergyTheme:
    path: ../../Packages/ExergyTheme

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_STRICT_CONCURRENCY: complete
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO

targets:
  ExergyPad:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: ../Shared
        excludes:
          - ExergyWidgetEntry.swift
          - WatchDial.swift
      - path: ../iOS/Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: ../iOS/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: ExergyCore
      - package: ExergyTheme
    info:
      path: Resources/GeneratedInfo.plist
      properties:
        CFBundleDisplayName: Exergy
        CFBundleURLTypes:
          - CFBundleURLName: com.lebonhommepharma.exergy
            CFBundleURLSchemes:
              - exergy
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
    entitlements:
      path: Resources/ExergyPad.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.lebonhommepharma.exergy
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.lebonhommepharma.exergy
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.lebonhommepharma.exergy
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lebonhommepharma.exergy.pad
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  ExergyPad:
    build:
      targets:
        ExergyPad: all
    run:
      config: Debug
